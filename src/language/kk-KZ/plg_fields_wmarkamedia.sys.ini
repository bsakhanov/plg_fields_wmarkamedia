PLG_FIELDS_WMARKAMEDIA_XML_DESCRIPTION="Бір плагин — мақалаларға арналған өрістің үш түрі: әмбебап видео (YouTube, Vimeo, VK, Rutube, Facebook, Instagram, TikTok, видеофайл; Telegram — сілтеме ретінде), көру терезесі бар фотогалерея және әлеуметтік желілер сілтемелерінің тізімі. Оқырман басқанға дейін ешқандай бөтен сценарий не плеер жүктелмейді."
